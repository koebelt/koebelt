<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from the design system's logo mark by npm run build:favicon.
         The mark is white on transparent, so it is composited onto the brand ink
         here — otherwise it vanishes against a light browser tab bar. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <title>Thomas Koebel | Software engineer</title>
    <meta
      name="description"
      content="Full-stack web and mobile engineer based in Niort, France, from the interface to the services behind it. Co-founder of Cbienlà, open to remote, hybrid or on-site roles."
    />

    <link rel="canonical" href="https://koebelt.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thomas Koebel" />
    <meta property="og:url" content="https://koebelt.com/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <!-- Built by npm run build:og from scripts/og/og-image.html. Absolute, because
         link-preview crawlers do not resolve relative image URLs. -->
    <meta property="og:image" content="https://koebelt.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Thomas Koebel, software engineer: full-stack web and mobile." />
    <meta property="og:title" content="Thomas Koebel | Software engineer" />
    <meta
      property="og:description"
      content="Full-stack web and mobile engineer based in Niort, France, from the interface to the services behind it. Co-founder of Cbienlà, open to remote, hybrid or on-site roles."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://koebelt.com/og-image.png" />

    <!-- The design system's styles.css @imports these too; the link makes the request
         start during HTML parse instead of after the CSS has been fetched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
