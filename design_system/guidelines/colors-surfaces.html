<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Four levels, one step apart — depth without shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page);font:var(--text-body-md)}.cap{font:var(--text-label-sm);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-faint)}.row{display:flex;gap:12px}.g{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="height:96px;background:var(--surface-deep);border:1px solid var(--border-hairline);border-radius:var(--radius-xs);padding:10px"><span class="cap">deep</span></div>
<div style="height:96px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:var(--radius-xs);padding:10px"><span class="cap">sunken</span></div>
<div style="height:96px;background:var(--surface-page);border:1px solid var(--border-hairline);border-radius:var(--radius-xs);padding:10px"><span class="cap">page</span></div>
<div style="height:96px;background:var(--surface-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-xs);padding:10px"><span class="cap">raised</span></div></div></body></html>
