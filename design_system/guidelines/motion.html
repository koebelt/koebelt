<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="140ms controls, 220ms UI, 640ms reveals — one easing curve" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page);font:var(--text-body-md)}.cap{font:var(--text-label-sm);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-faint)}.row{display:flex;gap:12px}.g{display:grid;gap:10px}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:grid;grid-template-columns:140px 70px 1fr;gap:12px;align-items:baseline"><span class="cap">--dur-fast</span><span style="font:var(--text-body-sm);color:var(--text-primary)">140ms</span><span style="font:var(--text-body-sm);color:var(--text-muted)">controls: colour, border</span></div><div style="display:grid;grid-template-columns:140px 70px 1fr;gap:12px;align-items:baseline"><span class="cap">--dur-base</span><span style="font:var(--text-body-sm);color:var(--text-primary)">220ms</span><span style="font:var(--text-body-sm);color:var(--text-muted)">panels, tabs</span></div><div style="display:grid;grid-template-columns:140px 70px 1fr;gap:12px;align-items:baseline"><span class="cap">--dur-slow</span><span style="font:var(--text-body-sm);color:var(--text-primary)">380ms</span><span style="font:var(--text-body-sm);color:var(--text-muted)">dialogs</span></div><div style="display:grid;grid-template-columns:140px 70px 1fr;gap:12px;align-items:baseline"><span class="cap">--dur-reveal</span><span style="font:var(--text-body-sm);color:var(--text-primary)">640ms</span><span style="font:var(--text-body-sm);color:var(--text-muted)">scroll reveals: fade + 16px rise</span></div>
<div class="cap" style="margin-top:4px">--ease-standard cubic-bezier(.2,.8,.2,1) · no bounce, no spring</div></div></body></html>
