<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page);font:var(--text-body-md)}.cap{font:var(--text-label-sm);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-faint)}.row{display:flex;gap:12px}.g{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
<div style="height:100px;background:var(--surface-raised);box-shadow:var(--shadow-inset-hairline);border-radius:var(--radius-sm);padding:12px"><span class="cap">inset hairline · default</span></div>
<div style="height:100px;background:var(--surface-raised);box-shadow:var(--shadow-raised);border-radius:var(--radius-sm);padding:12px"><span class="cap">raised · rare</span></div>
<div style="height:100px;background:var(--surface-raised);box-shadow:var(--shadow-overlay);border-radius:var(--radius-sm);padding:12px"><span class="cap">overlay · dialogs only</span></div></div></body></html>
