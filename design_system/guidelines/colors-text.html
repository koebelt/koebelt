<!-- @dsCard group="Colors" viewport="700x180" name="Text colours" subtitle="Four levels of hierarchy on the dark surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page);font:var(--text-body-md)}.cap{font:var(--text-label-sm);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-faint)}.row{display:flex;gap:12px}.g{display:grid;gap:10px}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-primary);font:var(--text-heading-xs)">Primary — headings and statements</span><span class="cap">--text-primary</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-secondary);font:var(--text-body-md)">Secondary — running body copy</span><span class="cap">--text-secondary</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-muted);font:var(--text-body-md)">Muted — captions and summaries</span><span class="cap">--text-muted</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-faint);font:var(--text-body-sm)">Faint — years, indices, metadata</span><span class="cap">--text-faint</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-accent);font:var(--text-body-md)">Accent — active state and eyebrows</span><span class="cap">--text-accent</span></div></div></body></html>
