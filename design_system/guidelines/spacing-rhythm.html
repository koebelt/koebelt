<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page);font:var(--text-body-md)}.cap{font:var(--text-label-sm);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-faint)}.row{display:flex;gap:12px}.g{display:grid;gap:10px}</style></head><body><div style="display:flex;flex-direction:column">
<div style="padding-bottom:24px;border-bottom:1px solid var(--border-hairline)"><span class="cap">section a</span></div>
<div style="height:var(--space-12);display:flex;align-items:center;justify-content:center;background:var(--lime-a16)"><span class="cap" style="color:var(--text-accent)">--section-y · 96px</span></div>
<div style="padding-top:24px;border-top:1px solid var(--border-hairline);display:flex;flex-direction:column;gap:8px"><span class="cap">section b</span><span style="font:var(--text-body-sm);color:var(--text-muted)">8px stack-tight between related lines</span></div></div></body></html>
