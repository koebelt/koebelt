<!-- @dsCard group="Colors" viewport="700x150" name="Signal colours" subtitle="Desaturated on purpose so lime stays the accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page);font:var(--text-body-md)}.cap{font:var(--text-label-sm);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--text-faint)}.row{display:flex;gap:12px}.g{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--signal-positive);border-radius:var(--radius-xs);box-shadow:var(--shadow-inset-hairline)"></div><div style="font:var(--text-label-sm);letter-spacing:.06em;color:var(--text-secondary)">positive</div><div style="font:var(--text-label-sm);color:var(--text-faint)">--signal-positive</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--signal-warning);border-radius:var(--radius-xs);box-shadow:var(--shadow-inset-hairline)"></div><div style="font:var(--text-label-sm);letter-spacing:.06em;color:var(--text-secondary)">warning</div><div style="font:var(--text-label-sm);color:var(--text-faint)">--signal-warning</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--signal-negative);border-radius:var(--radius-xs);box-shadow:var(--shadow-inset-hairline)"></div><div style="font:var(--text-label-sm);letter-spacing:.06em;color:var(--text-secondary)">negative</div><div style="font:var(--text-label-sm);color:var(--text-faint)">--signal-negative</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--signal-info);border-radius:var(--radius-xs);box-shadow:var(--shadow-inset-hairline)"></div><div style="font:var(--text-label-sm);letter-spacing:.06em;color:var(--text-secondary)">info</div><div style="font:var(--text-label-sm);color:var(--text-faint)">--signal-info</div></div></div></body></html>
